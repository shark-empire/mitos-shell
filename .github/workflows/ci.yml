name: mitos-shell build-test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  # Allows you to manually trigger the workflow with a debug option
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable SSH debugging (tmate)'
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format, Lint, Check, Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcrypt-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Check
        run: cargo check --all-targets --all-features

      - name: Build (Debug)
        run: cargo build --verbose

      - name: Build (Release)
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      # ============================================
      # TMATE SSH DEBUGGING STEP
      # ============================================
      # This step pauses the workflow and gives you an SSH connection
      # string. Connect from iSH on your iPhone using that string.
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
        timeout-minutes: 60
        with:
          limit-access-to-actor: true
