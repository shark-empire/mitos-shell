[package]
name = "mitos-shell"
version = "0.2.0"
edition = "2021"
description = "The default POSIX-compliant command-line interpreter for MITOS"

[dependencies]
# Core System & Kernel Interaction
nix = { version = "0.29", features = ["term", "process", "signal", "fs"] }
libc = "0.2"

# Modern REPL & UI
rustyline = "14.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
dirs = "5.0"
glob = "0.3"
