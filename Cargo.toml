[package]
name = "mitos-shell"
version = "2.0.0"
edition = "2021"
authors = ["shark <babor3331@gmail.com>"]
description = "The industry-standard command-line interpreter for MITOS"

[dependencies]
# Modern line-editing, history, and keybindings
rustyline = "14.0"
# POSIX APIs for signal handling and job control
nix = { version = "0.29", features = ["signal", "process", "term"] }
# Pathname expansion (wildcards like *.rs)
glob = "0.3"
# Cross-platform directory resolution
dirs = "5.0"
